<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusHub — Log in</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-header">
        <h1>CampusHub</h1>
        <p>Student communication & management system</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Log In</button>
        <button class="auth-tab" data-tab="signup">Sign Up</button>
      </div>

      <div class="auth-body">
        <!-- Login -->
        <div class="auth-panel active" id="panel-login">
          <div class="form-msg" id="loginMsg"></div>
          <form id="loginForm">
            <div class="field">
              <label for="loginEmail">Email</label>
              <input type="email" id="loginEmail" required autocomplete="email" />
            </div>
            <div class="field">
              <label for="loginPassword">Password</label>
              <input type="password" id="loginPassword" required autocomplete="current-password" />
              <label class="hint" style="display:flex; align-items:center; gap:6px; margin-top:6px; cursor:pointer;">
                <input type="checkbox" id="loginPasswordToggle" style="width:auto;" /> Show password
              </label>
            </div>
            <button class="btn btn-primary" type="submit" id="loginBtn">Log In</button>
          </form>
        </div>

        <!-- Sign up -->
        <div class="auth-panel" id="panel-signup">
          <div class="form-msg" id="signupMsg"></div>
          <form id="signupForm">
            <div class="field">
              <label for="signupName">Full name</label>
              <input type="text" id="signupName" required autocomplete="name" />
            </div>
            <div class="field">
              <label for="signupEmail">Email</label>
              <input type="email" id="signupEmail" required autocomplete="email" />
              <div class="hint">Use your college email address where possible.</div>
            </div>
            <div class="field">
              <label for="signupPassword">Password</label>
              <input type="password" id="signupPassword" required minlength="6" autocomplete="new-password" />
              <div class="hint">At least 6 characters.</div>
              <label class="hint" style="display:flex; align-items:center; gap:6px; margin-top:6px; cursor:pointer;">
                <input type="checkbox" id="signupPasswordToggle" style="width:auto;" /> Show password
              </label>
            </div>
            <button class="btn btn-primary" type="submit" id="signupBtn">Create Account</button>
            <div class="hint" style="margin-top:12px; text-align:center;">
              New accounts start as Students. Lecturer access is granted by an admin.
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { signUp, logIn, getUserRole, roleHome } from "./js/auth.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { auth } from "./js/firebase-config.js";

    // If already logged in, skip straight to the right dashboard.
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const role = await getUserRole(user.uid);
         if (["student", "lecturer", "admin"].includes(role)) window.location.href = roleHome(role);
      }
    });

    // Tab switching
    document.querySelectorAll(".auth-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".auth-tab").forEach((t) => t.classList.remove("active"));
        document.querySelectorAll(".auth-panel").forEach((p) => p.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById("panel-" + tab.dataset.tab).classList.add("active");
      });
    });

    // Show/hide password toggles
    document.getElementById("loginPasswordToggle").addEventListener("change", (e) => {
      document.getElementById("loginPassword").type = e.target.checked ? "text" : "password";
    });
    document.getElementById("signupPasswordToggle").addEventListener("change", (e) => {
      document.getElementById("signupPassword").type = e.target.checked ? "text" : "password";
    });

    function showMsg(el, text, type) {
      el.textContent = text;
      el.className = "form-msg " + type;
    }

    function friendlyError(err) {
      const code = err.code || "";
      if (code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found")) {
        return "Incorrect email or password.";
      }
      if (code.includes("email-already-in-use")) {
        return "An account with this email already exists. Try logging in instead.";
      }
      if (code.includes("weak-password")) {
        return "Password must be at least 6 characters.";
      }
      if (code.includes("invalid-email")) {
        return "Please enter a valid email address.";
      }
      if (code.includes("account-disabled")) {
        return "This account has been disabled. Contact your campus admin.";
      }
      return "Something went wrong. Please try again.";
    }
    if (new URLSearchParams(location.search).has("badprofile")) {  
      showMsg(document.getElementById("loginMsg"), "That account has no valid profile in Firestore (users collection): it is missing, or its role isn't exactly student, lecturer or admin. Fix it there, then log in again.", "error");  
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("loginMsg");
      const btn = document.getElementById("loginBtn");
      msg.className = "form-msg";
      btn.disabled = true;
      btn.textContent = "Logging in…";
      try {
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;
        const user = await logIn(email, password);
        const role = await getUserRole(user.uid);
        window.location.href = roleHome(role);
      } catch (err) {
        console.error("Login failed:", err.code, err.message);
        showMsg(msg, friendlyError(err), "error");
        btn.disabled = false;
        btn.textContent = "Log In";
      }
    });

    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("signupMsg");
      const btn = document.getElementById("signupBtn");
      msg.className = "form-msg";
      btn.disabled = true;
      btn.textContent = "Creating account…";
      try {
        const name = document.getElementById("signupName").value.trim();
        const email = document.getElementById("signupEmail").value.trim();
        const password = document.getElementById("signupPassword").value;
        await signUp(name, email, password);
        window.location.href = "student.html";
      } catch (err) {
        showMsg(msg, friendlyError(err), "error");
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
